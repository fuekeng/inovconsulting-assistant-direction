version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: assistant-mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME:-assistant}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-ffffffff}
    volumes:
      # Persiste la base MySQL entre les redémarrages
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-ffffffff}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  assistant:
    build: .
    container_name: assistant-direction
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
