# Pipeline CI/CD — Assistant de Direction
#
# Étapes : build → test → package → docker (build + push vers Amazon ECR + déploiement ECS)
# Le build/push de l'image Docker et le déploiement ne se déclenchent que sur push vers la branche `dev`.
#
# Authentification AWS via OIDC (pas de secrets d'accès à stocker) : le rôle IAM
# `assistant-direction-ia-dev-github-actions` doit faire confiance à l'identité OIDC de ce repo.

name: CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  id-token: write   # requis pour obtenir le jeton OIDC
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compiler
        run: ./mvnw -B -ntp clean compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Lancer les tests
        run: ./mvnw -B -ntp test

      - name: Publier le rapport de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Résultats des tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Construire le jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Sauvegarder le jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Build & Push ECR + Déploiement ECS
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY_URL: 312728689045.dkr.ecr.eu-west-3.amazonaws.com/assistant-direction-ia-dev
      ECS_CLUSTER_NAME: assistant-direction-ia-dev
      ECS_SERVICE_NAME: assistant-direction-ia-dev
    steps:
      - uses: actions/checkout@v4

      - name: Configurer les identifiants AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::312728689045:role/assistant-direction-ia-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Build, push vers ECR et déploiement ECS
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ env.ECR_REPOSITORY_URL }}
          docker build -t ${{ env.ECR_REPOSITORY_URL }}:dev -t ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }} .
          docker push ${{ env.ECR_REPOSITORY_URL }}:dev
          docker push ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER_NAME }} --service ${{ env.ECS_SERVICE_NAME }} --force-new-deployment
