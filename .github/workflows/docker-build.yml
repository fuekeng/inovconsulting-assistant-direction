# Pipeline CI/CD — Assistant de Direction
#
# Étapes : build → test → package → docker (build + push Docker Hub)
# Le build/push de l'image Docker ne se déclenche que sur push vers la branche `dev`.
#
# Secrets GitHub à définir (Settings > Secrets and variables > Actions) :
#   DOCKERHUB_USERNAME : nom d'utilisateur Docker Hub
#   DOCKERHUB_TOKEN     : access token Docker Hub (pas le mot de passe du compte)

name: CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compiler
        run: ./mvnw -B -ntp clean compile

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Lancer les tests
        run: ./mvnw -B -ntp test

      - name: Publier le rapport de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Résultats des tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Construire le jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Sauvegarder le jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/assistant-direction:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/assistant-direction:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
